name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check syntax
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" | xargs -I {} php -l {}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v3

      - name: Require production SSH secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          missing=0
          [ -n "$PROD_HOST" ] || { echo "PROD_HOST is not set for the production environment"; missing=1; }
          [ -n "$PROD_USER" ] || { echo "PROD_USER is not set for the production environment"; missing=1; }
          [ -n "$PROD_SSH_KEY" ] || { echo "PROD_SSH_KEY is not set for the production environment"; missing=1; }
          exit "$missing"

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -e
            cd /var/www/talksasa-cloud
            chmod +x scripts/deploy-production.sh
            APP_PATH=/var/www/talksasa-cloud bash scripts/deploy-production.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /var/www/talksasa-cloud

            # Check app health
            curl -fsS http://localhost:8000/up

            # Check scheduler + queue runtime, not just database status rows
            sudo systemctl is-active --quiet talksasa-scheduler.timer
            sudo systemctl is-active --quiet talksasa-queue.service
            sudo systemctl is-active --quiet talksasa-platform-cron-queue@1.service
            sudo systemctl is-active --quiet talksasa-container-cron-queue@1.service
            sudo systemctl is-active --quiet talksasa-backup-queue.service
            php artisan cron:verify-runtime

            echo "✅ Deployment verified"

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v3

      - name: Rollback on failure
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /var/www

            # Find latest backup
            LATEST_BACKUP=$(ls -t talksasa-cloud.backup.* | head -1)

            if [ -z "$LATEST_BACKUP" ]; then
              echo "❌ No backup found!"
              exit 1
            fi

            echo "⚠️  Rolling back to $LATEST_BACKUP"
            rm -rf talksasa-cloud.old
            mv talksasa-cloud talksasa-cloud.old
            mv $LATEST_BACKUP talksasa-cloud

            cd talksasa-cloud
            sudo systemctl restart talksasa-queue.service
            sudo systemctl restart 'talksasa-platform-cron-queue@*.service'
            sudo systemctl restart 'talksasa-container-cron-queue@*.service'
            sudo systemctl restart talksasa-backup-queue.service
            sudo systemctl restart talksasa-scheduler.timer

            echo "✅ Rollback complete"
